[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7v2-interface-mirth-engine"
version = "2.0.0"
description = "HL7-Mirth Inspector: LIS/HIS Message Stream Quality, Segment Triage & PHI Sanitizer"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hl7v2-interface-mirth-engine = "hl7v2_interface_mirth_agent.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/hl7v2-interface-mirth-engine"
Repository = "https://github.com/abusuraihsakhri/hl7v2-interface-mirth-engine.git"
